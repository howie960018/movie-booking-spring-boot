<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電影訂票系統</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-film"></i>
                <span>電影訂票系統</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="#" class="nav-link active" data-page="movies">熱映中</a></li>
                <li><a href="#" class="nav-link" data-page="my-bookings">我的訂票</a></li>
                <li id="adminMenuItem" style="display: none;"><a href="#" class="nav-link" data-page="admin">管理後台</a></li>
            </ul>
            <div class="nav-actions">
                <div id="userSection" style="display: none;">
                    <span id="userName" class="user-name"></span>
                    <button id="logoutBtn" class="btn btn-outline">登出</button>
                </div>
                <div id="authSection">
                    <button id="loginBtn" class="btn btn-outline">登入</button>
                    <button id="registerBtn" class="btn btn-primary">註冊</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Movies Page -->
        <div id="moviesPage" class="page active">
            <div class="container">
                <div class="page-header">
                    <h1>現正熱映</h1>
                    <p>選擇您想觀看的電影</p>
                </div>
                <div id="moviesList" class="movies-grid">
                    <!-- Movies will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Movie Detail Page -->
        <div id="movieDetailPage" class="page">
            <div class="container">
                <button id="backToMovies" class="btn btn-text">
                    <i class="fas fa-arrow-left"></i> 返回電影列表
                </button>
                <div id="movieDetail" class="movie-detail">
                    <!-- Movie detail will be loaded here -->
                </div>
            </div>
        </div>

        <!-- My Bookings Page -->
        <div id="myBookingsPage" class="page">
            <div class="container">
                <div class="page-header">
                    <h1>我的訂票記錄</h1>
                    <p>查看和管理您的訂票</p>
                </div>
                <div id="bookingsList" class="bookings-list">
                    <!-- Bookings will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Admin Page -->
        <div id="adminPage" class="page">
            <div class="container">
                <div class="page-header">
                    <h1>管理後台</h1>
                </div>
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="movies">電影管理</button>
                    <button class="tab-btn" data-tab="screenings">場次管理</button>
                    <button class="tab-btn" data-tab="bookings">訂單管理</button>
                </div>
                <div id="adminContent">
                    <!-- Admin content will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>會員登入</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">電子郵件</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">密碼</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登入</button>
                <p class="form-footer">還不是會員？ <a href="#" id="switchToRegister">立即註冊</a></p>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>會員註冊</h2>
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="registerFirstName">名字</label>
                        <input type="text" id="registerFirstName" required>
                    </div>
                    <div class="form-group">
                        <label for="registerLastName">姓氏</label>
                        <input type="text" id="registerLastName" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="registerEmail">電子郵件</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPhone">手機號碼</label>
                    <input type="tel" id="registerPhone" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">密碼</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">註冊</button>
                <p class="form-footer">已經是會員？ <a href="#" id="switchToLogin">立即登入</a></p>
            </form>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <h2>選擇座位</h2>
            <div id="bookingContent">
                <!-- Booking content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/movies.js"></script>
    <script src="js/bookings.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
